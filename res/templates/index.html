<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS Report</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏切换按钮 -->
        <button id="sidebar-toggle" title="切换导航栏">☰</button>
        
        <!-- 左侧导航 -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2 id="header-title">GNSS Report</h2>
                <button id="lang-toggle" title="切换语言">中</button>
            </div>
            <ul id="nav-list"></ul>
        </nav>

        <!-- 右侧主要内容 -->
        <div id="content">
            <iframe id="page-frame" class="page-frame" data-src="data/summary_report.html"></iframe>
        </div>
    </div>

    <div id="image-modal" class="modal">
        <span class="modal-close">&times;</span>
        <div class="modal-content-wrapper">
            <img class="modal-content" id="modal-img">
            <div id="modal-caption" class="modal-caption"></div>
        </div>
        <div class="modal-controls">
            <button class="modal-btn" id="zoom-out" title="缩小">-</button>
            <button class="modal-btn" id="zoom-reset" title="复位">1:1</button>
            <button class="modal-btn" id="zoom-in" title="放大">+</button>
        </div>
    </div>

    <script src="assets/js/lang.js"></script>
    <script>
        /** 当前语言：en / zh，localStorage 记忆 */
        let currentLang = localStorage.getItem('gnss-lang') || 'en';

        /** 导航结构数据：仅需 label 和 children，href 自动从 label 推导 */
        const navItems = [
            { label: 'Report' },
            { label: 'Satellites Trend' },
            { label: 'SVs Used Trend' },
            { label: 'CN0 Trend', children: [
                { label: 'GPS CN0' },
                { label: 'BDS1 CN0' },
                { label: 'BDS2 CN0' },
                { label: 'GAL CN0' },
                { label: 'GLO CN0' },
                { label: 'QZSS CN0' },
                { label: 'IRNSS CN0' },
            ]},
            { label: 'SOG Trend' },
            { label: 'COG Trend' },
            { label: 'DOP Trend' },
            { label: 'Alt/Sep Trend' },
            { label: 'Time Continuity' },
            { label: 'Accuracy Trend' },
            { label: 'Fix Accuracy Trend' },
            { label: 'Float Accuracy Trend' },
            { label: 'PQTMVEL Trend' },
            { label: 'RTK Delay' },
        ];

        /** label → data/xxx.html */
        function labelToHref(label) {
            return 'data/' + label.toLowerCase().replace(/[\s/]+/g, '_') + '.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const navList = document.getElementById('nav-list');
            const pageFrame = document.getElementById('page-frame');

            // 当前选中的导航页，切换语言重渲染时保持高亮
            let activeHref = 'data/report.html';

            function renderNav() {
                navList.innerHTML = '';
                navItems.forEach(item => {
                    if (item.children) {
                        const li = document.createElement('li');
                        li.className = 'nav-group';
                        li.innerHTML = `<a href="javascript:void(0)" class="nav-group-toggle">${t(item.label)} <span class="arrow">▶</span></a>`;
                        const ul = document.createElement('ul');
                        ul.className = 'nav-group-items';
                        item.children.forEach(child => {
                            const a = document.createElement('a');
                            a.href = '#';
                            a.setAttribute('data-href', labelToHref(child.label));
                            a.textContent = t(child.label);
                            ul.appendChild(document.createElement('li')).appendChild(a);
                        });
                        li.appendChild(ul);
                        navList.appendChild(li);
                    } else {
                        const href = labelToHref(item.label);
                        const a = document.createElement('a');
                        a.href = '#';
                        a.setAttribute('data-href', href);
                        a.textContent = t(item.label);
                        if (href === activeHref) a.className = 'active';
                        navList.appendChild(document.createElement('li')).appendChild(a);
                    }
                });
            }

            function loadPage(href) {
                if (href && pageFrame) pageFrame.src = href;
            }

            navList.addEventListener('click', function(e) {
                const a = e.target.closest('a');
                if (!a) return;

                if (a.classList.contains('nav-group-toggle')) {
                    e.preventDefault();
                    e.stopPropagation();
                    a.closest('.nav-group').classList.toggle('expanded');
                    return;
                }

                const href = a.getAttribute('data-href');
                if (href) {
                    e.preventDefault();
                    navList.querySelectorAll('a').forEach(l => l.classList.remove('active'));
                    a.classList.add('active');
                    activeHref = href;
                    loadPage(href);
                }
            });

            const langToggle = document.getElementById('lang-toggle');

            function applyLang() {
                langToggle.textContent = currentLang === 'en' ? '中' : 'EN';
                langToggle.title = currentLang === 'en' ? '切换语言' : 'Switch language';
                document.getElementById('header-title').textContent = t('GNSS Report');
                document.getElementById('sidebar-toggle').title = currentLang === 'en' ? '切换导航栏' : 'Toggle sidebar';
            }

            langToggle.addEventListener('click', function() {
                currentLang = currentLang === 'en' ? 'zh' : 'en';
                localStorage.setItem('gnss-lang', currentLang);
                applyLang();
                renderNav();
            });

            renderNav();
            applyLang();
            loadPage('data/report.html');
        });
    </script>
</body>
</html>
