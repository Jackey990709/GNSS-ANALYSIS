<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS轨迹地图</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="anonymous" 
          onerror="console.error('Failed to load Leaflet CSS')" />
    <style>
        :root {
            --primary-color: #1a1a2e; /* Dark Blue - 主色调 */
            --secondary-color: #0f3460; /* Medium Blue - 次要色调 */
            --accent-color: #e94560; /* Red/Pink - 强调色 */
            --text-primary: #2c3e50; /* Dark Gray */
            --text-secondary: #596275; /* Gray */
            --bg-body: #f5f5f5; /* Light Gray Background */
            --sidebar-bg: #16213e;
            --sidebar-text: #e0e0e0;
            --border-color: #ddd;
            --font-serif: 'Times New Roman', 'SimSun', 'Microsoft YaHei', serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: "JetBrains Mono", Consolas, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: var(--bg-body);
        }
        #mapContainer {
            width: 100%;
            height: 100vh;
        }
        .legend {
            position: absolute;
            top: 60px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 0;
            border-top: 3px solid var(--secondary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
            font-size: 12px;
            max-width: 200px;
            font-family: var(--font-sans);
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid #ddd;
            margin-right: 8px;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
        .control-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            transform: translateX(-100%);
            border-right: 3px solid var(--secondary-color);
            font-family: var(--font-sans);
        }
        .control-panel.expanded {
            transform: translateX(0);
        }
        .control-panel-toggle-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            opacity: 1;
            visibility: visible;
        }
        .control-panel-toggle-icon:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }
        .control-panel-toggle-icon.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .control-panel-header {
            position: relative;
            background: rgba(0,0,0,0.2);
            color: white;
            padding: 20px 15px;
            border-bottom: 2px solid var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
        }
        .control-panel-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            width: 100%;
            font-family: var(--font-serif);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .control-panel-header .toggle-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            color: var(--sidebar-text);
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            margin: 0; /* Reset margin */
            border-radius: 4px;
            transition: color 0.2s;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .control-panel-header .toggle-btn:hover {
            color: var(--accent-color);
            background: rgba(255,255,255,0.1);
            transform: none; /* Prevent button jump */
            box-shadow: none; /* Prevent shadow */
        }
        .control-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--sidebar-bg);
        }
        .control-panel-content::-webkit-scrollbar {
            width: 6px;
        }
        .control-panel-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .control-panel-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        .control-panel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
        .control-panel.collapsed .control-panel-content {
            display: none;
        }
        .panel-section {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .panel-section-header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: transparent;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            color: var(--sidebar-text);
        }
        .panel-section-header:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .panel-section-header.active {
            background: var(--secondary-color);
            border-left: 3px solid var(--accent-color);
            padding-left: 17px; /* Compensate for border */
        }
        .panel-section-title {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-section-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .panel-section-toggle {
            color: var(--text-secondary);
            font-size: 12px;
            transition: transform 0.2s;
        }
        .panel-section.collapsed .panel-section-toggle {
            transform: rotate(-90deg);
        }
        .panel-section-content {
            padding: 15px 20px;
            display: block;
            background: rgba(0,0,0,0.1);
        }
        .panel-section.collapsed .panel-section-content {
            display: none;
        }
        .control-panel label {
            display: block;
            margin: 10px 0 5px 0;
            font-size: 13px;
            color: #ccc;
            font-weight: 500;
        }
        .control-panel input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 13px;
            color: white;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .control-panel input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255,255,255,0.1);
            box-shadow: none;
        }
        .control-panel input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .control-panel button {
            width: 100%;
            padding: 10px;
            background: var(--secondary-color);
            color: white;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .control-panel button:hover {
            background: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .control-panel button:active {
            transform: translateY(0);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }
        .info-item {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-label {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .info-value {
            color: white;
            font-weight: 600;
            font-size: 14px;
            font-family: var(--font-mono);
        }
        .quality-checkbox {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quality-checkbox:hover {
            background: rgba(255,255,255,0.05);
        }
        .quality-checkbox input {
            accent-color: var(--accent-color);
            width: auto;
            margin-right: 10px;
            margin-bottom: 0;
        }
        .tool-btn {
            margin-bottom: 8px;
        }
        .tool-btn.secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .tool-btn.secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }
        .tool-btn.tertiary {
            background: #27ae60;
        }
        .tool-btn.tertiary:hover {
            background: #2ecc71;
        }
        .time-slider-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .time-slider-container h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 14px;
            color: #e0e0e0;
        }
        .time-slider-wrapper {
            position: relative;
            margin: 10px 0;
        }
        .time-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .time-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .slider-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .slider-controls button {
            width: auto;
            padding: 5px 12px;
            margin: 0;
            font-size: 11px;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid transparent;
        }
        .slider-controls button:hover {
            background-color: var(--accent-color);
        }
        .slider-time-display {
            font-size: 12px;
            color: #e0e0e0;
            font-weight: bold;
            text-align: center;
            flex: 1;
            margin: 0 10px;
            font-family: var(--font-mono);
        }
        .time-label-pin {
            background: transparent !important;
            border: none !important;
        }
        .time-label-pin svg {
            display: block;
            pointer-events: none;
        }
    </style>
    </head>
<body>
    <button class="control-panel-toggle-icon" onclick="togglePanel()" id="toggleIcon" title="展开控制面板">☰</button>
    <div class="control-panel" id="controlPanel">
        <div class="control-panel-header">
            <h3>控制台</h3>
            <button class="toggle-btn" onclick="togglePanel()" id="toggleBtn" title="折叠控制面板">✕</button>
        </div>
        <div class="control-panel-content">
            <!-- 错误提示区域 -->
            <div id="errorMessageContainer" style="display: none; margin-bottom: 10px; padding: 10px; background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; border-radius: 4px;">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div style="flex: 1;">
                        <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 5px;">⚠️ 错误提示</div>
                        <div id="errorMessageText" style="color: #ffcdd2; font-size: 12px; line-height: 1.5;"></div>
                    </div>
                    <button onclick="document.getElementById('errorMessageContainer').style.display='none'" style="background: none; border: none; color: #ff6b6b; font-size: 18px; cursor: pointer; padding: 0; margin-left: 10px; line-height: 1;">×</button>
                </div>
            </div>

            <!-- 文件选择 -->
            <div class="panel-section collapsed" id="filesSection">
                <div class="panel-section-header" onclick="toggleSection('filesSection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">📁</span>
                        <span>文件选择</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <div id="fileListContainer">
                        <p style="color: #ccc; font-size: 12px; margin: 8px 0;">正在加载文件列表...</p>
                    </div>
                </div>
            </div>

            <!-- 时间控制 -->
            <div class="panel-section collapsed" id="timeSection">
                <div class="panel-section-header" onclick="toggleSection('timeSection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">⏱️</span>
                        <span>时间控制</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <label for="startTime">起始时间</label>
                    <input type="text" id="startTime" placeholder="120000.000" />
                    <label for="endTime">结束时间</label>
                    <input type="text" id="endTime" placeholder="120500.000" />
                    <button onclick="updateTimeWindow()">应用时间窗口</button>
                    
                    <div class="time-slider-container" style="margin-top: 15px;">
                        <label>时间滑动条（5分钟窗口）</label>
                        <div class="time-slider-wrapper">
                            <input type="range" id="timeSlider" class="time-slider" min="0" max="100" value="0" step="1" />
                            <div class="slider-controls">
                                <button onclick="moveSlider(-1)" style="width: auto; padding: 5px 10px; margin: 0;">◀</button>
                                <div class="slider-time-display" id="sliderTimeDisplay">00:00:00 - 00:05:00</div>
                                <button onclick="moveSlider(1)" style="width: auto; padding: 5px 10px; margin: 0;">▶</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 定位质量过滤 -->
            <div class="panel-section collapsed" id="qualitySection">
                <div class="panel-section-header" onclick="toggleSection('qualitySection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">🎯</span>
                        <span>定位质量</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <div class="quality-checkbox">
                        <input type="checkbox" id="quality1" checked onchange="updateQualityFilter()" />
                        <span style="color: #e74c3c; font-weight: 500;">1 - GNSS定位</span>
                    </div>
                    <div class="quality-checkbox">
                        <input type="checkbox" id="quality2" checked onchange="updateQualityFilter()" />
                        <span style="color: #4aa3df; font-weight: 500;">2 - DGNSS定位</span>
                    </div>
                    <div class="quality-checkbox">
                        <input type="checkbox" id="quality4" checked onchange="updateQualityFilter()" />
                        <span style="color: #2ecc71; font-weight: 500;">4 - RTK固定解</span>
                    </div>
                    <div class="quality-checkbox">
                        <input type="checkbox" id="quality5" checked onchange="updateQualityFilter()" />
                        <span style="color: #f1c40f; font-weight: 500;">5 - RTK浮点解</span>
                    </div>
                    <div class="quality-checkbox">
                        <input type="checkbox" id="quality6" checked onchange="updateQualityFilter()" />
                        <span style="color: #95a5a6; font-weight: 500;">6 - 惯导</span>
                    </div>
                    <hr style="margin: 12px 0; border: none; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div class="quality-checkbox">
                        <input type="checkbox" id="useFileColor" onchange="updateColorMode()" />
                        <span style="font-weight: 500;">按文件颜色显示</span>
                    </div>
                </div>
            </div>

            <!-- 工具箱 -->
            <div class="panel-section collapsed" id="toolsSection">
                <div class="panel-section-header" onclick="toggleSection('toolsSection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">🛠️</span>
                        <span>工具箱</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <button onclick="clearAllMeasurements()" class="tool-btn secondary">🗑️ 清除测量</button>
                    <button onclick="fitToTrajectory()" class="tool-btn tertiary">🎯 定位到轨迹</button>
                </div>
            </div>

            <!-- 时间标签 -->
            <div class="panel-section collapsed" id="timeLabelSection">
                <div class="panel-section-header" onclick="toggleSection('timeLabelSection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">🏷️</span>
                        <span>时间标签</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <label for="timeLabelInput">输入时间 (hhmmss.xxx)</label>
                    <input type="text" id="timeLabelInput" placeholder="120000.000" />
                    <button onclick="addTimeLabel()" class="tool-btn tertiary">📍 添加时间标签</button>
                    <button onclick="clearTimeLabels()" class="tool-btn secondary" style="margin-top: 8px;">🗑️ 清除所有标签</button>
                    
                    <!-- 已添加的标签列表 -->
                    <div id="timeLabelListContainer" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: none;">
                        <div style="font-size: 13px; font-weight: 500; margin-bottom: 10px; color: #333;">已添加的标签</div>
                        <div id="timeLabelList" style="max-height: 200px; overflow-y: auto;">
                            <!-- 标签列表将动态生成 -->
                        </div>
                    </div>
                    
                    <div id="timeLabelInfo" style="margin-top: 12px; font-size: 11px; color: #ccc; display: none;">
                        <div id="timeLabelStatus"></div>
                    </div>
                </div>
            </div>

            <!-- 数据信息 -->
            <div class="panel-section collapsed" id="infoSection">
                <div class="panel-section-header" onclick="toggleSection('infoSection')">
                    <div class="panel-section-title">
                        <span class="panel-section-icon">ℹ️</span>
                        <span>数据信息</span>
                    </div>
                    <span class="panel-section-toggle">▶</span>
                </div>
                <div class="panel-section-content">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">总点数</div>
                            <div class="info-value" id="totalPoints">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">当前显示</div>
                            <div class="info-value" id="displayedPoints">0</div>
                        </div>
                    </div>
                    <div style="margin-top: 12px; font-size: 11px; color: #ccc;">
                        <div style="margin-bottom: 4px;"><strong>全部数据:</strong> <span id="totalTimeRange">-</span></div>
                        <div><strong>当前窗口:</strong> <span id="currentTimeRange">-</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="mapContainer"></div>

    <script>

            };
            document.head.appendChild(script);
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script src="https://unpkg.com/leaflet-measure@3.1.0/dist/leaflet-measure.js"></script>
    <script>
        // 从JSON文件加载位置数据
        let allPositions = []; // 所有位置数据
        let filteredPositions = []; // 过滤后的位置数据
        let fileDataMap = {}; // 文件数据映射 {filename: {positions: [], polyline: null, markers: [], color: '', visible: true}}
        let availableFiles = []; // 可用的文件列表
        let map;
        let markers = [];
        let startTime = null;
        let endTime = null;
        let currentLayer = null; // 当前使用的底图
        let gaodeStandard = null; // 高德标准地图图层引用
        let gaodeSatellite = null; // 高德卫星图图层引用
        let gaodeRoad = null; // 高德路网图图层引用
        let googleSatellite = null; // 谷歌卫星图图层引用

        // WGS84转GCJ-02坐标转换函数（高德地图坐标系）
        function wgs84ToGcj02(wgsLat, wgsLon) {
            const a = 6378245.0; // 长半轴
            const ee = 0.00669342162296594323; // 偏心率平方
            
            let dLat = transformLat(wgsLon - 105.0, wgsLat - 35.0);
            let dLon = transformLon(wgsLon - 105.0, wgsLat - 35.0);
            const radLat = wgsLat / 180.0 * Math.PI;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            const gcjLat = wgsLat + dLat;
            const gcjLon = wgsLon + dLon;
            return [gcjLat, gcjLon];
        }

        function transformLat(lon, lat) {
            let ret = -100.0 + 2.0 * lon + 3.0 * lat + 0.2 * lat * lat + 0.1 * lon * lat + 0.2 * Math.sqrt(Math.abs(lon));
            ret += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(lat * Math.PI) + 40.0 * Math.sin(lat / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(lat / 12.0 * Math.PI) + 320 * Math.sin(lat * Math.PI / 30.0)) * 2.0 / 3.0;
            return ret;
        }

        function transformLon(lon, lat) {
            let ret = 300.0 + lon + 2.0 * lat + 0.1 * lon * lon + 0.1 * lon * lat + 0.1 * Math.sqrt(Math.abs(lon));
            ret += (20.0 * Math.sin(6.0 * lon * Math.PI) + 20.0 * Math.sin(2.0 * lon * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(lon * Math.PI) + 40.0 * Math.sin(lon / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(lon / 12.0 * Math.PI) + 300.0 * Math.sin(lon / 30.0 * Math.PI)) * 2.0 / 3.0;
            return ret;
        }

                    // 计算总距离
                    const latlngs = layer.getLatLngs();
                    let totalDistance = 0;
                    
                    for (let i = 1; i < latlngs.length; i++) {
                        const distance = latlngs[i-1].distanceTo(latlngs[i]);
                        totalDistance += distance;
                    }
                    
                    // 添加距离标签

                        ? totalDistance.toFixed(2) + ' 米' 
                        : (totalDistance / 1000).toFixed(2) + ' 公里';

                drawnItems.addLayer(layer);
            });

        // 解析时间字符串为秒数（从00:00:00开始）
        // 支持格式: hhmmss.xxx (例如 123045.123) 或 HH:MM:SS (兼容旧格式)
        function parseTimeToSeconds(timeStr) {
            if (!timeStr || timeStr.trim() === '') return null;
            timeStr = timeStr.trim();
            
            // 尝试解析 hhmmss.xxx 格式
            // 匹配 6位数字，后面可选的小数点和数字
            const compactMatch = timeStr.match(/^(\d{2})(\d{2})(\d{2})(?:\.(\d+))?$/);
            if (compactMatch) {
                const hours = parseInt(compactMatch[1], 10);
                const minutes = parseInt(compactMatch[2], 10);
                const seconds = parseInt(compactMatch[3], 10);
                // 处理小数部分
                const milliseconds = compactMatch[4] ? parseFloat('0.' + compactMatch[4]) : 0;
                
                return hours * 3600 + minutes * 60 + seconds + milliseconds;
            }

            // 兼容旧格式 HH:MM:SS
            const parts = timeStr.split(':');
            if (parts.length >= 2) {
                const hours = parseInt(parts[0]) || 0;
                const minutes = parseInt(parts[1]) || 0;
                const seconds = parseFloat(parts[2]) || 0; // seconds might include decimals
                return hours * 3600 + minutes * 60 + seconds;
            }
            
            return null;
        }

        // 将秒数转换为时间字符串（保留3位小数）
        // 输出格式: hhmmss.xxx
        function secondsToTimeString(seconds) {
            // 先四舍五入到毫秒，避免浮点数精度问题
            const totalMilliseconds = Math.round(seconds * 1000);
            
            const ms = totalMilliseconds % 1000;
            const totalSecondsInt = Math.floor(totalMilliseconds / 1000);
            
            const sFinal = totalSecondsInt % 60;
            const totalMinutes = Math.floor(totalSecondsInt / 60);
            const mFinal = totalMinutes % 60;
            const hFinal = Math.floor(totalMinutes / 60);
            
            const hS = String(hFinal).padStart(2, '0');
            const mS = String(mFinal).padStart(2, '0');
            const sS = String(sFinal).padStart(2, '0');
            const msS = String(ms).padStart(3, '0');
            
            return `${hS}${mS}${sS}.${msS}`;
        }

        // 格式化UTC时间戳，保留小数点后三位
        // 输出格式: hhmmss.xxx
        function formatTimestamp(timestamp) {
            if (!timestamp || timestamp === '') return '-';
            
            // 尝试解析时间并统一格式化
            const seconds = parsePositionTimestamp(timestamp);
            if (seconds !== null) {
                return secondsToTimeString(seconds);
            }
            
            // 如果无法解析，则回退到简单的字符串处理（兼容旧逻辑）
            if (timestamp.includes('.')) {
                const parts = timestamp.split('.');
                const timePart = parts[0].replace(/:/g, ''); // 去掉冒号
                const decimalPart = parts[1] || '';
                const truncatedDecimal = decimalPart.substring(0, 3);
                const paddedDecimal = truncatedDecimal.padEnd(3, '0');
                return `${timePart}.${paddedDecimal}`;
            }
            
            return timestamp.replace(/:/g, '') + '.000';
        }

        // 解析位置数据中的时间戳
        function parsePositionTimestamp(timestamp) {
            if (!timestamp || timestamp === '') return null;
            // timestamp可能是 "HH:MM:SS" 或 "HH:MM:SS.xxx" 格式
            // 尝试解析多种格式，包括小数部分
            const timeMatch = timestamp.match(/(\d{1,2}):(\d{1,2}):(\d{1,2})(?:\.(\d+))?/);
            if (timeMatch) {
                const hours = parseInt(timeMatch[1]);
                const minutes = parseInt(timeMatch[2]);
                const seconds = parseInt(timeMatch[3]);
                const milliseconds = timeMatch[4] ? parseFloat('0.' + timeMatch[4]) : 0;
                return hours * 3600 + minutes * 60 + seconds + milliseconds;
            }
            return null;
        }

        // 根据时间窗口和定位质量过滤位置数据
        function filterPositionsByTimeWindow() {
            // 更新所有位置数据
            updateAllPositions();
            
            let timeFiltered = [];
            
            if (!startTime || !endTime) {
                // 如果没有设置时间窗口，使用默认：前5分钟的数据
                if (allPositions.length === 0) {
                    filteredPositions = [];
                    return;
                }
                
                // 找到第一个有效的时间戳
                let firstTime = null;
                for (let pos of allPositions) {
                    const time = parsePositionTimestamp(pos.timestamp);
                    if (time !== null) {
                        firstTime = time;
                        break;
                    }
                }
                
                if (firstTime === null) {
                    // 如果没有时间戳，使用所有点
                    timeFiltered = allPositions;
                } else {
                    const endTimeSeconds = firstTime + 300; // 5分钟 = 300秒
                    timeFiltered = allPositions.filter(pos => {
                        const posTime = parsePositionTimestamp(pos.timestamp);
                        if (posTime === null) return false;
                        return posTime >= firstTime && posTime <= endTimeSeconds;
                    });
                    
                    // 更新输入框
                    document.getElementById('startTime').value = secondsToTimeString(firstTime);
                    document.getElementById('endTime').value = secondsToTimeString(endTimeSeconds);
                    startTime = firstTime;
                    endTime = endTimeSeconds;
                }
            } else {
                timeFiltered = allPositions.filter(pos => {
                    const posTime = parsePositionTimestamp(pos.timestamp);
                    if (posTime === null) return false;
                    return posTime >= startTime && posTime <= endTime;
                });
            }
            
            // 再根据定位质量过滤
            filteredPositions = timeFiltered.filter(pos => {
                const quality = pos.quality || 0;
                return selectedQualities.has(quality);
            });

            // 更新总点数
            updateTotalPoints();
        }

        ];

                    // 对于HTTP协议，尝试使用fetch
                    fetch(url)

                                            reject(new Error(`JSON解析失败: ${e.message}\n响应预览: ${preview}...\nURL: ${url}`));

        // 切换文件显示/隐藏
        function toggleFile(filename, index) {
            const checkbox = document.getElementById(`file_${index}`);
            if (!fileDataMap[filename]) {
                // 文件未加载，先加载
                if (checkbox.checked) {
                    loadFile(filename, index);
                }
                return;
            }

            fileDataMap[filename].visible = checkbox.checked;
            updateFileVisibility(filename);
            updateAllPositions();
            filterPositionsByTimeWindow();
        }

        // 更新文件可见性
        function updateFileVisibility(filename) {
            const fileData = fileDataMap[filename];
            if (!fileData) return;

            if (fileData.visible) {
                if (fileData.polyline && !map.hasLayer(fileData.polyline)) {
                    fileData.polyline.addTo(map);
                }
                fileData.markers.forEach(marker => {
                    if (!map.hasLayer(marker)) {
                        marker.addTo(map);
                    }
                });
            } else {
                if (fileData.polyline && map.hasLayer(fileData.polyline)) {
                    map.removeLayer(fileData.polyline);
                }
                fileData.markers.forEach(marker => {
                    if (map.hasLayer(marker)) {
                        map.removeLayer(marker);
                    }
                });
            }
        }

        // 更新所有位置数据（合并所有可见文件的数据）
        function updateAllPositions() {
            allPositions = [];
            Object.keys(fileDataMap).forEach(filename => {
                if (fileDataMap[filename].visible) {
                    allPositions = allPositions.concat(fileDataMap[filename].positions);
                }
            });
        }

        // 更新总点数显示
        function updateTotalPoints() {
            let total = 0;
            Object.keys(fileDataMap).forEach(filename => {
                if (fileDataMap[filename].visible) {
                    total += fileDataMap[filename].positions.length;
                }
            });
            document.getElementById('totalPoints').textContent = total;
        }

        // 绘制单个文件的轨迹
        function drawFileTrajectory(filename) {
            const fileData = fileDataMap[filename];
            if (!fileData || !fileData.visible) {
                console.warn(`文件 ${filename} 不可见或数据不存在`);
                return;
            }

            // 过滤该文件的数据
            const fileFiltered = filterFilePositions(filename);
            if (fileFiltered.length === 0) {
                console.warn(`文件 ${filename} 过滤后没有数据点`);
                return;
            }
            
            console.log(`开始绘制轨迹: ${filename}, 数据点数: ${fileFiltered.length}`);

            // 清除旧的轨迹线
            if (fileData.polyline) {
                map.removeLayer(fileData.polyline);
            }

            // 转换坐标格式
            const path = fileFiltered.map(pos => convertCoordinate(pos.lat, pos.lon));

            // 创建折线
            fileData.polyline = L.polyline(path, {
                color: fileData.color,
                weight: 3,
                opacity: 1,
                smoothFactor: 1
            });

            if (fileData.visible) {
                fileData.polyline.addTo(map);
            }

            // 绘制标记
            drawFileMarkers(filename, fileFiltered);
        }

        // 过滤单个文件的位置数据
        function filterFilePositions(filename) {
            const fileData = fileDataMap[filename];
            if (!fileData) {
                console.warn(`文件 ${filename} 的数据不存在`);
                return [];
            }

            let timeFiltered = [];
            // 如果时间窗口未设置，使用所有数据（在首次加载时）
            if (startTime === null || endTime === null) {
                console.log(`时间窗口未设置，使用所有数据。文件: ${filename}, 数据点数: ${fileData.positions.length}`);
                timeFiltered = fileData.positions;
            } else {
                timeFiltered = fileData.positions.filter(pos => {
                    const posTime = parsePositionTimestamp(pos.timestamp);
                    if (posTime === null) return false;
                    return posTime >= startTime && posTime <= endTime;
                });
                console.log(`时间窗口过滤后，文件: ${filename}, 数据点数: ${timeFiltered.length}`);
            }

            // 根据定位质量过滤
            const qualityFiltered = timeFiltered.filter(pos => {
                const quality = pos.quality || 0;
                return selectedQualities.has(quality);
            });
            
            console.log(`质量过滤后，文件: ${filename}, 数据点数: ${qualityFiltered.length}`);
            return qualityFiltered;
        }

        // 绘制单个文件的标记
        function drawFileMarkers(filename, positions) {
            const fileData = fileDataMap[filename];
            if (!fileData) return;

            // 清除旧的标记
            fileData.markers.forEach(marker => {
                if (map.hasLayer(marker)) {
                    map.removeLayer(marker);
                }
            });
            fileData.markers = [];

            // 创建新标记
            positions.forEach((pos, index) => {
                const [lat, lon] = convertCoordinate(pos.lat, pos.lon);
                const quality = pos.quality || 0;

                // 根据颜色模式选择颜色
                const color = useFileColorMode ? fileData.color : getQualityColor(quality);

                const marker = L.circleMarker([lat, lon], {
                    radius: 4,
                    fillColor: color,
                    color: color,  // 使用与填充色相同的颜色，减少白边
                    weight: 0.5,   // 减小边框宽度
                    opacity: 1,
                    fillOpacity: 1  // 提高填充不透明度
                });

                // 绑定弹窗信息
                const timeStr = formatTimestamp(pos.timestamp);
                const altitude = pos.altitude !== undefined ? pos.altitude.toFixed(2) : 'N/A';
                const displayName = getDisplayName(filename);
                marker.bindPopup(`
                    <div style="font-size: 12px; line-height: 1.6;">
                        <strong>文件:</strong> ${displayName}<br>
                        <strong>点序号:</strong> ${index + 1}<br>
                        <strong>UTC时间:</strong> ${timeStr}<br>
                        <strong>定位质量:</strong> ${quality}<br>
                        <strong>纬度:</strong> ${lat.toFixed(8)}<br>
                        <strong>经度:</strong> ${lon.toFixed(8)}<br>
                        <strong>海拔:</strong> ${altitude} 米
                    </div>
                `);

                if (fileData.visible) {
                    marker.addTo(map);
                }
                fileData.markers.push(marker);
            });
        }

        // 加载位置数据（兼容旧代码）
        function loadPositions() {
            if(window.initialData){loadEmbeddedData();}else{loadFileList();}
        }

        // 计算总时间范围（从所有可见文件）
        function calculateTimeRange() {
            updateAllPositions();
            
            let minTime = null;
            let maxTime = null;
            
            // 使用全部原始数据计算时间范围
            for (let pos of allPositions) {
                const posTime = parsePositionTimestamp(pos.timestamp);
                if (posTime !== null) {
                    if (minTime === null || posTime < minTime) {
                        minTime = posTime;
                    }
                    if (maxTime === null || posTime > maxTime) {
                        maxTime = posTime;
                    }
                }
            }
            
            if (minTime === null || maxTime === null) {
                minTime = 0;
                maxTime = 300; // 默认5分钟
            }
            
            totalTimeRange.min = minTime;
            totalTimeRange.max = maxTime;
            
            // 更新显示的全部数据时间范围
            document.getElementById('totalTimeRange').textContent = 
                `${secondsToTimeString(minTime)} - ${secondsToTimeString(maxTime)}`;
        }

        // 初始化时间滑动条
        function initTimeSlider() {
            const slider = document.getElementById('timeSlider');
            // 使用全部数据的时间范围来计算滑动条范围
            const totalDuration = totalTimeRange.max - totalTimeRange.min;
            
            console.log('初始化时间滑动条 - 全部数据时间范围:', {
                min: secondsToTimeString(totalTimeRange.min),
                max: secondsToTimeString(totalTimeRange.max),
                duration: totalDuration,
                durationMinutes: (totalDuration / 60).toFixed(2)
            });
            
            // 计算可以移动的步数（每步5分钟 = 300秒）
            // 例如：总时长15分钟，窗口5分钟，可以移动10分钟，即2步（0, 1, 2）
            const maxSteps = Math.max(0, Math.floor((totalDuration - windowDuration) / 300));
            
            if (maxSteps <= 0 || totalDuration <= windowDuration) {
                // 如果总时长小于等于窗口时长，滑动条禁用
                slider.max = 0;
                slider.value = 0;
                slider.disabled = true;
                document.getElementById('sliderTimeDisplay').textContent = 
                    `${secondsToTimeString(totalTimeRange.min)} - ${secondsToTimeString(totalTimeRange.max)}`;
                console.log('时间滑动条已禁用 - 总时长小于等于窗口时长');
                return;
            }
            
            slider.disabled = false;
            slider.max = maxSteps;
            slider.step = 1; // 每步移动一个5分钟窗口
            slider.value = 0;
            
            console.log('时间滑动条范围:', {
                min: 0,
                max: maxSteps,
                windowDuration: windowDuration,
                totalDuration: totalDuration
            });
            
            // 监听滑动条变化
            slider.addEventListener('input', function() {
                updateTimeWindowFromSlider();
            });
            
            // 初始化显示
            updateTimeWindowFromSlider();
        }

        // 根据滑动条位置更新时间窗口
        function updateTimeWindowFromSlider() {
            const slider = document.getElementById('timeSlider');
            const step = parseInt(slider.value);
            
            // 计算当前窗口的起始时间（每次移动5分钟 = 300秒）
            const windowStart = totalTimeRange.min + step * 300;
            const windowEnd = Math.min(windowStart + windowDuration, totalTimeRange.max);
            
            // 更新时间窗口
            startTime = windowStart;
            endTime = windowEnd;
            
            // 更新输入框
            document.getElementById('startTime').value = secondsToTimeString(windowStart);
            document.getElementById('endTime').value = secondsToTimeString(windowEnd);
            
            // 更新滑动条显示
            document.getElementById('sliderTimeDisplay').textContent = 
                `${secondsToTimeString(windowStart)} - ${secondsToTimeString(windowEnd)}`;
            
            // 重新过滤位置数据
            filterPositionsByTimeWindow();
            
            // 重新绘制轨迹和标记
            drawTrajectory();
        }

        // 移动滑动条（向前或向后5分钟）
        function moveSlider(direction) {
            const slider = document.getElementById('timeSlider');
            if (slider.disabled) return;
            
            const currentValue = parseInt(slider.value);
            const maxValue = parseInt(slider.max);
            const newValue = currentValue + direction;
            
            if (newValue >= 0 && newValue <= maxValue) {
                slider.value = newValue;
                updateTimeWindowFromSlider();
            }
        }

        // 根据定位质量获取颜色
        function getQualityColor(quality) {
            switch(quality) {
                case 1: return 'red';      // 红色
                case 2: return 'blue';    // 蓝色
                case 4: return 'green';   // 绿色
                case 5: return 'yellow';  // 黄色
                case 6: return 'gray';     // 灰色 - 惯导
                default: return 'gray';    // 默认灰色
            }
        }

        // 清除所有标记
        function clearMarkers() {
            markers.forEach(marker => {
                map.removeLayer(marker);
            });
            markers = [];
        }

        // 绘制标记（显示5分钟内所有点）
        function drawMarkers() {
            clearMarkers();
            
            if (filteredPositions.length === 0) return;
            
            // 显示所有过滤后的点（不采样）
            filteredPositions.forEach((pos, index) => {
                const quality = pos.quality || 0;
                const color = getQualityColor(quality);
                
                // 转换坐标（如果是高德地图则转换为GCJ-02）
                const [lat, lon] = convertCoordinate(pos.lat, pos.lon);
                
                const marker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: 'quality-marker',
                        html: `<div style="background-color: ${color}; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.5);"></div>`,
                        iconSize: [6, 6]
                    })
                }).addTo(map);
                
                const timeStr = formatTimestamp(pos.timestamp);
                marker.bindPopup(`点 ${index + 1}<br>UTC时间: ${timeStr}<br>定位质量: ${quality}<br>纬度: ${lat.toFixed(8)}<br>经度: ${lon.toFixed(8)}`);
                markers.push(marker);
            });
            
            // 更新显示的标记数量
            document.getElementById('displayedPoints').textContent = filteredPositions.length;
            // 更新当前窗口时间范围显示
            if (startTime !== null && endTime !== null) {
                document.getElementById('currentTimeRange').textContent = 
                    `${secondsToTimeString(startTime)} - ${secondsToTimeString(endTime)}`;
            }
        }

        // 绘制轨迹（绘制所有可见文件的轨迹）
        function drawTrajectory() {
            // 清除所有旧轨迹
            Object.keys(fileDataMap).forEach(filename => {
                const fileData = fileDataMap[filename];
                if (fileData.polyline) {
                    map.removeLayer(fileData.polyline);
                    fileData.polyline = null;
                }
                fileData.markers.forEach(marker => {
                    if (map.hasLayer(marker)) {
                        map.removeLayer(marker);
                    }
                });
                fileData.markers = [];
            });

            // 绘制每个可见文件的轨迹
            let hasVisibleData = false;
            Object.keys(fileDataMap).forEach(filename => {
                if (fileDataMap[filename].visible) {
                    drawFileTrajectory(filename);
                    if (fileDataMap[filename].positions.length > 0) {
                        hasVisibleData = true;
                    }
                }
            });

            if (!hasVisibleData) {
                console.warn('当前时间窗口内没有数据点');
                return;
            }

            // 调整地图视野以包含所有可见轨迹
            const bounds = L.latLngBounds([]);
            Object.keys(fileDataMap).forEach(filename => {
                const fileData = fileDataMap[filename];
                if (fileData.visible && fileData.polyline) {
                    bounds.extend(fileData.polyline.getBounds());
                }
            });

            if (!bounds.isValid()) {
                // 如果没有有效边界，使用所有可见文件的标记点
                Object.keys(fileDataMap).forEach(filename => {
                    const fileData = fileDataMap[filename];
                    if (fileData.visible) {
                        fileData.markers.forEach(marker => {
                            bounds.extend(marker.getLatLng());
                        });
                    }
                });
            }

            if (bounds.isValid()) {
                map.fitBounds(bounds, {
                    padding: [50, 50]
                });
            }
        }

        // 更新时间窗口
        function updateTimeWindow() {
            const startTimeStr = document.getElementById('startTime').value;
            const endTimeStr = document.getElementById('endTime').value;
            
            const startSeconds = parseTimeToSeconds(startTimeStr);
            const endSeconds = parseTimeToSeconds(endTimeStr);
            
            if (startSeconds === null || endSeconds === null) {
                alert('请输入有效的时间格式 (HH:MM:SS)');
                return;
            }
            
            if (startSeconds >= endSeconds) {
                alert('起始时间必须小于结束时间');
                return;
            }
            
            startTime = startSeconds;
            endTime = endSeconds;
            
            // 重新过滤位置数据
            filterPositionsByTimeWindow();
            
            // 重新绘制轨迹和标记
            drawTrajectory();
        }

        // 更新定位质量过滤
        function updateQualityFilter() {
            // 更新选中的定位质量集合
            selectedQualities.clear();
            
            if (document.getElementById('quality1').checked) {
                selectedQualities.add(1);
            }
            if (document.getElementById('quality2').checked) {
                selectedQualities.add(2);
            }
            if (document.getElementById('quality4').checked) {
                selectedQualities.add(4);
            }
            if (document.getElementById('quality5').checked) {
                selectedQualities.add(5);
            }
            if (document.getElementById('quality6').checked) {
                selectedQualities.add(6);
            }
            
            // 如果没有任何选中项，提示用户
            if (selectedQualities.size === 0) {
                alert('请至少选择一个定位质量类型');
                // 恢复最后一个取消的选项
                const checkboxes = ['quality1', 'quality2', 'quality4', 'quality5', 'quality6'];
                for (let cb of checkboxes) {
                    if (!document.getElementById(cb).checked) {
                        document.getElementById(cb).checked = true;
                        const quality = parseInt(cb.replace('quality', ''));
                        selectedQualities.add(quality);
                        break;
                    }
                }
                return;
            }
            
            // 重新过滤位置数据
            filterPositionsByTimeWindow();

            // 重新绘制轨迹和标记
            drawTrajectory();
        }

        // 更新颜色模式
        function updateColorMode() {
            // 更新颜色模式标志
            useFileColorMode = document.getElementById('useFileColor').checked;

            // 重新绘制所有轨迹和标记
            drawTrajectory();
        }

        // 添加时间标签
        function addTimeLabel() {
            const timeInput = document.getElementById('timeLabelInput').value.trim();
            if (!timeInput) {
                alert('请输入时间 (格式: hhmmss.xxx)');
                return;
            }

            // 解析输入的时间
            const targetTime = parseTimeToSeconds(timeInput);
            if (targetTime === null) {
                alert('时间格式错误，请输入 hhmmss.xxx 格式');
                return;
            }

            // 在所有可见文件中查找该时间的点
            const foundPoints = [];
            Object.keys(fileDataMap).forEach(filename => {
                const fileData = fileDataMap[filename];
                if (!fileData || !fileData.visible) return;

                // 查找最接近目标时间的点
                let closestPoint = null;
                let minTimeDiff = Infinity;

                fileData.positions.forEach(pos => {
                    const posTime = parsePositionTimestamp(pos.timestamp);
                    if (posTime === null) return;

                    const timeDiff = Math.abs(posTime - targetTime);
                    if (timeDiff < minTimeDiff) {
                        minTimeDiff = timeDiff;
                        closestPoint = {
                            ...pos,
                            filename: filename,
                            timeDiff: timeDiff
                        };
                    }
                });

                // 找到最接近的点（放宽误差范围到5秒，但优先选择误差最小的点）
                if (closestPoint && minTimeDiff <= 5.0) {
                    foundPoints.push(closestPoint);
                    console.log(`找到时间点: ${timeInput}, 文件: ${filename}, 时间差: ${minTimeDiff.toFixed(3)}秒, 原始坐标: [${closestPoint.lat}, ${closestPoint.lon}]`);
                }
            });

            if (foundPoints.length === 0) {
                const statusDiv = document.getElementById('timeLabelStatus');
                const infoDiv = document.getElementById('timeLabelInfo');
                if (statusDiv && infoDiv) {
                    statusDiv.innerHTML = `<span style="color: #ff6b6b;">❌ 未找到时间 ${timeInput} 对应的点</span>`;
                    infoDiv.style.display = 'block';
                }
                alert(`未找到时间 ${timeInput} 对应的点`);
                return;
            }

            // 获取或分配该时间的颜色（相同时间使用相同颜色）
            let pinColor;
            if (timeLabelColorMap[timeInput]) {
                // 如果该时间已有颜色，使用相同颜色
                pinColor = timeLabelColorMap[timeInput];
            } else {
                // 如果该时间没有颜色，分配新颜色
                pinColor = timeLabelColors[timeLabelColorIndex % timeLabelColors.length];
                timeLabelColorMap[timeInput] = pinColor;
                timeLabelColorIndex++;
            }

            // 不清除旧的时间标签，累积添加
            // 为每个找到的点添加标签
            foundPoints.forEach((point, index) => {
                // 使用与轨迹点相同的坐标转换方式

            // 如果有多个标签，调整视野以包含所有标签
            if (timeLabelMarkers.length > 0) {
                const bounds = L.latLngBounds(timeLabelMarkers.map(m => {
                    return m.marker.getLatLng();
                }));
                if (bounds.isValid()) {
                    map.fitBounds(bounds, {
                        padding: [50, 50],
                        maxZoom: 18
                    });
                }
            } else if (foundPoints.length === 1) {
                // 如果只有一个点，定位到该点
                const point = foundPoints[0];
                const [lat, lon] = convertCoordinate(point.lat, point.lon);
                map.setView([lat, lon], Math.max(map.getZoom(), 16), {
                    animate: true,
                    duration: 0.5
                });
            }
        }

        // 删除单个时间标签（通过ID）
        function removeTimeLabelById(labelId) {
            const index = timeLabelMarkers.findIndex(label => label.id === labelId);
            if (index === -1) {
                console.error('未找到标签ID:', labelId);
                return;
            }

            removeTimeLabelByIndex(index);
        }

        // 删除单个时间标签（通过索引，内部使用）
        function removeTimeLabelByIndex(index) {
            if (index < 0 || index >= timeLabelMarkers.length) {
                console.error('无效的标签索引:', index);
                return;
            }

            const labelData = timeLabelMarkers[index];
            if (!labelData) {
                console.error('标签数据不存在:', index);
                return;
            }

            // 从地图中移除标记
            if (timeLabelGroup && labelData.marker) {
                timeLabelGroup.removeLayer(labelData.marker);
            }

            // 从数组中移除
            timeLabelMarkers.splice(index, 1);

            // 更新标签列表
            updateTimeLabelList();

            console.log(`已删除时间标签: ${labelData.time}`);
        }

        // 删除单个时间标签（兼容旧接口，使用索引）
        function removeTimeLabel(index) {
            removeTimeLabelByIndex(index);
        }

        // 更新标签列表显示
        function updateTimeLabelList() {
            const listContainer = document.getElementById('timeLabelListContainer');
            const listDiv = document.getElementById('timeLabelList');
            
            if (!listContainer || !listDiv) {
                return;
            }

            if (timeLabelMarkers.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            listContainer.style.display = 'block';

            // 按时间分组显示标签
            const timeGroups = {};
            timeLabelMarkers.forEach((label, index) => {
                if (!timeGroups[label.time]) {
                    timeGroups[label.time] = [];
                }
                timeGroups[label.time].push({...label, index: index});
            });

            let html = '';
            Object.keys(timeGroups).sort().forEach(time => {
                const labels = timeGroups[time];
                labels.forEach(label => {
                    const [lat, lon] = convertCoordinate(label.originalLat, label.originalLon);
                    html += `
                        <div style="
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            padding: 6px 8px;
                            margin: 4px 0;
                            background: rgba(255,255,255,0.05);
                            border-radius: 4px;
                            border-left: 3px solid ${label.color};
                        ">
                            <div style="flex: 1; font-size: 12px;">
                                <div style="font-weight: 500; color: #fff;">${time}</div>
                                <div style="font-size: 10px; color: #ccc; margin-top: 2px;">
                                    ${label.displayName || '未知文件'} | ${lat.toFixed(6)}, ${lon.toFixed(6)}
                                </div>
                            </div>
                            <button onclick="removeTimeLabelById('${label.id}')" style="
                                background: #e74c3c;
                                color: white;
                                border: none;
                                border-radius: 3px;
                                padding: 4px 8px;
                                font-size: 11px;
                                cursor: pointer;
                                margin-left: 8px;
                            " title="删除此标签">🗑️</button>
                        </div>
                    `;
                });
            });

            listDiv.innerHTML = html;
        }

        // 更新所有时间标签的坐标（当切换底图时调用）
        function updateTimeLabelCoordinates() {
            if (!timeLabelGroup || timeLabelMarkers.length === 0) {
                return;
            }

            console.log('更新时间标签坐标以适应新的坐标框架...');
            
            timeLabelMarkers.forEach((labelData, index) => {
                // 使用原始坐标重新转换
                const [newLat, newLon] = convertCoordinate(labelData.originalLat, labelData.originalLon);
                
                // 更新标记位置
                labelData.marker.setLatLng([newLat, newLon]);
                
                // 更新弹窗中的坐标显示
                const popup = labelData.marker.getPopup();
                if (popup) {
                    const popupContent = popup.getContent();
                    // 更新弹窗内容中的坐标显示
                    const updatedContent = popupContent.replace(
                        /<strong>纬度:<\/strong> [\d.]+<br>/,
                        `<strong>纬度:</strong> ${newLat.toFixed(8)}<br>`
                    ).replace(
                        /<strong>经度:<\/strong> [\d.]+<br>/,
                        `<strong>经度:</strong> ${newLon.toFixed(8)}<br>`
                    );
                    labelData.marker.setPopupContent(updatedContent);
                }
            });
            
            // 更新标签列表（因为坐标改变了）
            updateTimeLabelList();
            
            console.log(`已更新 ${timeLabelMarkers.length} 个时间标签的坐标`);
        }

        // 清除所有时间标签
        function clearTimeLabels() {
            if (timeLabelGroup) {
                timeLabelGroup.clearLayers();
            }
            timeLabelMarkers = [];
            timeLabelColorMap = {}; // 清除颜色映射
            timeLabelColorIndex = 0; // 重置颜色索引
            
            // 隐藏状态信息
            const infoDiv = document.getElementById('timeLabelInfo');
            if (infoDiv) {
                infoDiv.style.display = 'none';
            }
            
            // 更新标签列表
            updateTimeLabelList();
        }


        // 页面加载完成后初始化地图
        window.onload = function() {
            initMap();
            
            // 为时间标签输入框添加Enter键支持
            const timeLabelInput = document.getElementById('timeLabelInput');
            if (timeLabelInput) {
                timeLabelInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addTimeLabel();
                    }
                });
            }
        };
    </script>
<script>window.initialData = {{ initial_data|tojson }}; window.sceneName = '{{ scene_name }}';</script>

    <script>

    function loadEmbeddedData() {
        if (window.initialData && window.initialData.files) {
            const files = window.initialData.files;
            console.log(`Loading embedded multi-file data: ${files.length} files`);
            
            // Clear existing
            fileDataMap = {};
            availableFiles = [];
            
            files.forEach((file, index) => {
                const filename = file.name;
                const positions = file.positions;
                const isTruth = file.is_truth;
                
                // Determine color
                let color;
                if (isTruth) {
                    color = '#000000'; // Black for truth
                } else {
                    // Use trajectoryColors if available, else generate or default
                    color = (typeof trajectoryColors !== 'undefined') ? trajectoryColors[index % trajectoryColors.length] : '#3366FF';
                }
                
                fileDataMap[filename] = {
                    positions: positions || [],
                    polyline: null,
                    markers: [],
                    color: color,
                    visible: true
                };
                availableFiles.push(filename);
            });
            
            if (typeof renderFileList === 'function') renderFileList();
            if (typeof updateAllPositions === 'function') updateAllPositions();
            if (typeof updateTotalPoints === 'function') updateTotalPoints();
            if (typeof calculateTimeRange === 'function') calculateTimeRange();
            if (typeof initTimeSlider === 'function') initTimeSlider();
            if (typeof filterPositionsByTimeWindow === 'function') filterPositionsByTimeWindow();
            
            setTimeout(() => {
                if (typeof drawTrajectory === 'function') drawTrajectory();
            }, 0);
        }
    }
    </script>
    
</body>
</html>
